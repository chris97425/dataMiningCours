<svg xmlns="http://www.w3.org/2000/svg" width="730" height="226" viewBox="0 0 730 226" font-family="Roboto, Helvetica, Arial, sans-serif">
<rect width="730" height="226" fill="#ffffff"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d65f6"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect x="24" y="20" width="128" height="78" rx="8" fill="#f8faff" stroke="#93c5fd" stroke-width="2"/>
<text x="88" y="56" font-size="15" fill="#1e3a8a" font-weight="700" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">lev(i−1, j−1)</text>
<text x="88" y="80" font-size="13" fill="#4b5563" text-anchor="middle">diagonale</text>
<rect x="180" y="20" width="128" height="78" rx="8" fill="#f8faff" stroke="#93c5fd" stroke-width="2"/>
<text x="244" y="56" font-size="15" fill="#1e3a8a" font-weight="700" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">lev(i−1, j)</text>
<text x="244" y="80" font-size="13" fill="#4b5563" text-anchor="middle">haut</text>
<rect x="24" y="126" width="128" height="78" rx="8" fill="#f8faff" stroke="#93c5fd" stroke-width="2"/>
<text x="88" y="162" font-size="15" fill="#1e3a8a" font-weight="700" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">lev(i, j−1)</text>
<text x="88" y="186" font-size="13" fill="#4b5563" text-anchor="middle">gauche</text>
<rect x="180" y="126" width="128" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.6"/>
<text x="244" y="162" font-size="15" fill="#92400e" font-weight="700" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">lev(i, j)</text>
<text x="244" y="186" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">case à remplir</text>
<line x1="244" y1="100" x2="244" y2="122" stroke="#3d65f6" stroke-width="2.4" marker-end="url(#mb)"/>
<line x1="154" y1="165" x2="176" y2="165" stroke="#3d65f6" stroke-width="2.4" marker-end="url(#mb)"/>
<line x1="154" y1="100" x2="176" y2="122" stroke="#d97706" stroke-width="2.4" marker-end="url(#mo)"/>
<text x="340" y="40" font-size="15" fill="#3d65f6" font-weight="700" text-anchor="start">Depuis le haut : + 1</text>
<text x="340" y="61" font-size="14" fill="#1f2937" text-anchor="start">on supprime la lettre a<tspan baseline-shift="sub" font-size="10">i</tspan> du premier mot</text>
<text x="340" y="98" font-size="15" fill="#3d65f6" font-weight="700" text-anchor="start">Depuis la gauche : + 1</text>
<text x="340" y="119" font-size="14" fill="#1f2937" text-anchor="start">on insère la lettre b<tspan baseline-shift="sub" font-size="10">j</tspan> du second mot</text>
<text x="340" y="156" font-size="15" fill="#d97706" font-weight="700" text-anchor="start">Depuis la diagonale : + 0 ou + 1</text>
<text x="340" y="177" font-size="14" fill="#1f2937" text-anchor="start">+ 0 si a<tspan baseline-shift="sub" font-size="10">i</tspan> = b<tspan baseline-shift="sub" font-size="10">j</tspan>, sinon on remplace a<tspan baseline-shift="sub" font-size="10">i</tspan> par b<tspan baseline-shift="sub" font-size="10">j</tspan> (+ 1)</text>
<text x="340" y="214" font-size="14.5" fill="#111827" font-weight="700" text-anchor="start">La case prend le plus petit des trois résultats.</text>
</svg>
