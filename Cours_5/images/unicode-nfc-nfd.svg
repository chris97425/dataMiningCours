<svg xmlns="http://www.w3.org/2000/svg" width="780" height="228" viewBox="0 0 780 228" font-family="Roboto, Helvetica, Arial, sans-serif">
<rect width="780" height="228" fill="#ffffff"/>
<rect x="10" y="10" width="370" height="178" rx="10" fill="#f4f7ff" stroke="#3d65f6" stroke-width="1.6"/>
<rect x="400" y="10" width="370" height="178" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="30" y="42" font-size="17" fill="#1e3a8a" font-weight="700" text-anchor="start">Forme composée (NFC)</text>
<text x="30" y="64" font-size="14" fill="#4b5563" text-anchor="start">un seul point de code</text>
<rect x="58" y="84" width="80" height="80" rx="10" fill="#ffffff" stroke="#3d65f6" stroke-width="2.2"/>
<text x="98" y="132" font-size="40" fill="#111827" font-weight="700" text-anchor="middle">é</text>
<text x="98" y="155" font-size="12" fill="#3d65f6" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">U+00E9</text>
<text x="170" y="131" font-size="17" fill="#1e3a8a" font-weight="700" text-anchor="start">longueur : 1</text>
<text x="420" y="42" font-size="17" fill="#92400e" font-weight="700" text-anchor="start">Forme décomposée (NFD)</text>
<text x="420" y="64" font-size="14" fill="#4b5563" text-anchor="start">une lettre + un accent combinant</text>
<rect x="424" y="84" width="76" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.2"/>
<text x="462" y="132" font-size="40" fill="#111827" font-weight="700" text-anchor="middle">e</text>
<text x="462" y="155" font-size="12" fill="#b45309" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">U+0065</text>
<text x="516" y="132" font-size="26" fill="#d97706" font-weight="700" text-anchor="middle">+</text>
<rect x="532" y="84" width="76" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.2"/>
<text x="570" y="140" font-size="44" fill="#111827" font-weight="700" text-anchor="middle">´</text>
<text x="570" y="155" font-size="12" fill="#b45309" font-family="Menlo, Roboto Mono, monospace" text-anchor="middle">U+0301</text>
<text x="626" y="131" font-size="17" fill="#92400e" font-weight="700" text-anchor="start">longueur : 2</text>
<text x="390" y="216" font-size="14.5" fill="#111827" text-anchor="middle">À l'écran, les deux s'affichent « é ». Pour Python, ce sont deux chaînes différentes.</text>
</svg>
