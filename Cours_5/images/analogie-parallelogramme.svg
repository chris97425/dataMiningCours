<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Roboto, Helvetica, Arial, sans-serif">
<rect width="900" height="450" fill="#ffffff"/>
<polygon points="150,350 450,350 500,140 200,140" fill="#f4f7ff" stroke="#dbe4f7" stroke-dasharray="6 5"/>
<line x1="150" y1="350" x2="444.0" y2="350.0" stroke="#3d65f6" stroke-width="3.5" stroke-linecap="round"/><polygon points="450.0,350.0 437.9,354.8 437.9,345.2" fill="#3d65f6"/>
<line x1="200" y1="140" x2="494.0" y2="140.0" stroke="#3d65f6" stroke-width="3.5" stroke-linecap="round"/><polygon points="500.0,140.0 487.9,144.8 487.9,135.2" fill="#3d65f6"/>
<line x1="150" y1="350" x2="198.6" y2="145.8" stroke="#0f9d58" stroke-width="3.5" stroke-linecap="round"/><polygon points="200.0,140.0 201.9,152.9 192.5,150.6" fill="#0f9d58"/>
<line x1="450" y1="350" x2="498.6" y2="145.8" stroke="#0f9d58" stroke-width="3.5" stroke-linecap="round"/><polygon points="500.0,140.0 501.9,152.9 492.5,150.6" fill="#0f9d58"/>
<circle cx="150" cy="350" r="8" fill="#111827"/>
<text x="108" y="384" font-size="22" font-weight="700" fill="#111827">homme</text>
<circle cx="450" cy="350" r="8" fill="#111827"/>
<text x="432" y="384" font-size="22" font-weight="700" fill="#111827">femme</text>
<circle cx="200" cy="140" r="8" fill="#111827"/>
<text x="156" y="120" font-size="22" font-weight="700" fill="#111827">roi</text>
<circle cx="500" cy="140" r="8" fill="#111827"/>
<text x="514" y="122" font-size="22" font-weight="700" fill="#111827">reine</text>
<text x="240" y="392" font-size="17" fill="#3d65f6" font-weight="700">femme − homme</text>
<text x="265" y="112" font-size="17" fill="#3d65f6" font-weight="700">reine − roi</text>
<text x="70" y="268" font-size="17" fill="#0f9d58" font-weight="700" transform="rotate(-74 70 268)">roi − homme</text>
<text x="518" y="272" font-size="17" fill="#0f9d58" font-weight="700" transform="rotate(-74 518 272)">reine − femme</text>
<rect x="640" y="300" width="248" height="104" rx="10" fill="#f4f7ff" stroke="#3d65f6"/>
<text x="658" y="332" font-size="18" font-weight="700" fill="#111827">femme + (roi − homme)</text>
<text x="658" y="360" font-size="19" font-weight="700" fill="#3d65f6">= reine</text>
<text x="658" y="386" font-size="14" fill="#4b5563">soit  roi − homme + femme = reine</text>
<circle cx="648" cy="60" r="6" fill="#3d65f6"/><text x="664" y="66" font-size="16" fill="#4b5563">déplacement « genre »</text>
<circle cx="648" cy="90" r="6" fill="#0f9d58"/><text x="664" y="96" font-size="16" fill="#4b5563">déplacement « royauté »</text>
<text x="640" y="140" font-size="15" fill="#4b5563">schéma idéalisé : les deux flèches</text>
<text x="640" y="162" font-size="15" fill="#4b5563">bleues sont parallèles et de</text>
<text x="640" y="184" font-size="15" fill="#4b5563">même longueur, et de même pour</text>
<text x="640" y="206" font-size="15" fill="#4b5563">les deux flèches vertes.</text>
</svg>